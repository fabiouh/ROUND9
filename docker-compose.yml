services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: round9
      POSTGRES_PASSWORD: round9
      POSTGRES_DB: round9
    ports:
      - "5433:5432"
    volumes:
      - round9-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U round9"]
      interval: 5s
      retries: 10
volumes:
  round9-pg:
